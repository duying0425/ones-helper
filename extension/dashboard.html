<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>ONES 工时填写面板</title>
  <link rel="stylesheet" href="src/styles.css" />
  <style>
    body { padding: 20px 24px; max-width: 1200px; margin: 0 auto; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .topbar h1 { font-size: 20px; }
    .topbar .right { display: flex; align-items: center; gap: 12px; }
    .month-picker {
      display: flex; align-items: center; gap: 4px;
    }
    .month-picker button { padding: 4px 10px; }
    .month-picker input { width: 100px; text-align: center; }

    /* 步骤导航 */
    .steps {
      display: flex; gap: 4px; margin-bottom: 20px;
      background: var(--color-bg-card); padding: 8px; border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }
    .step {
      flex: 1; padding: 8px 12px; text-align: center;
      border-radius: var(--radius-sm); font-size: 13px;
      color: var(--color-text-secondary);
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .step.active { background: var(--color-primary); color: white; }
    .step.done { background: #E8FFEA; color: var(--color-success); }
    .step-num {
      width: 18px; height: 18px; border-radius: 50%;
      background: #F2F3F5; color: var(--color-text-secondary);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
    }
    .step.active .step-num { background: rgba(255,255,255,0.3); color: white; }
    .step.done .step-num { background: var(--color-success); color: white; }

    /* 月度容量摘要 */
    .summary {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px;
    }
    .summary .stat {
      background: var(--color-bg-card); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: 14px;
    }
    .summary .stat .label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
    .summary .stat .value { font-size: 22px; font-weight: 600; }
    .summary .stat .value.warn { color: var(--color-warning); }
    .summary .stat .value.ok { color: var(--color-success); }

    /* 任务表格 */
    .task-table th, .task-table td { padding: 8px; font-size: 13px; }
    .task-table .col-proj { width: 140px; }
    .task-table .col-status { width: 100px; }
    .task-table .col-remain { width: 90px; text-align: right; }
    .task-table .col-filed { width: 90px; text-align: right; }
    .task-table .col-hours { width: 110px; text-align: right; }

    /* 日历预览 */
    .calendar-card { padding: 16px; }
    .calendar-legend {
      display: flex; gap: 16px; margin-bottom: 12px; font-size: 12px; color: var(--color-text-secondary);
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-swatch {
      width: 12px; height: 12px; border-radius: 2px; border: 1px solid var(--color-border);
    }

    /* 状态流转候选列表 */
    .transition-candidates {
      max-height: 360px; overflow: auto;
    }
    .transition-candidates .table th, .transition-candidates .table td { font-size: 12px; padding: 6px 8px; }

    /* 提交日志 */
    .submit-log {
      max-height: 280px; overflow: auto;
      font-family: "Consolas", "Monaco", monospace; font-size: 12px;
      background: #1D2129; color: #C9CDD4; border-radius: var(--radius-md);
      padding: 12px;
    }
    .submit-log .ok { color: #00B42A; }
    .submit-log .fail { color: #F53F3F; }
    .submit-log .info { color: #86909C; }

    .section-title {
      font-size: 15px; font-weight: 600; margin: 20px 0 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title .badge { font-size: 12px; font-weight: 400; color: var(--color-text-secondary); }

    .actions-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin: 16px 0;
    }
    .actions-bar .left { display: flex; gap: 8px; }
    .actions-bar .right { display: flex; gap: 8px; }

    .empty-state {
      text-align: center; padding: 40px 20px; color: var(--color-text-secondary);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div style="display: flex; align-items: center; gap: 12px;">
      <h1 data-i18n="dashboardTitle">ONES 工时填写面板</h1>
      <span class="user-badge" id="userBadge" style="display:none; font-size:13px; padding:3px 10px; background:#E8FFEA; color:#00B42A; border-radius:12px; font-weight:500;"></span>
    </div>
    <div class="right">
      <div class="month-picker">
        <button class="btn-secondary btn-sm" id="btnPrevMonth">‹</button>
        <input class="input" type="month" id="monthInput" />
        <button class="btn-secondary btn-sm" id="btnNextMonth">›</button>
      </div>
      <button class="btn-secondary btn-sm" id="btnDebug" data-i18n="dashboardBtnDebug">调试</button>
      <button class="btn-secondary btn-sm" id="btnOptions" data-i18n="dashboardBtnOptions">配置</button>
    </div>
  </div>

  <!-- 步骤导航 -->
  <div class="steps">
    <div class="step" id="step1"><span class="step-num">1</span><span data-i18n="dashboardStep1">获取数据</span></div>
    <div class="step" id="step2"><span class="step-num">2</span><span data-i18n="dashboardStep2">规划工时</span></div>
    <div class="step" id="step3"><span class="step-num">3</span><span data-i18n="dashboardStep3">预览分配</span></div>
    <div class="step" id="step4"><span class="step-num">4</span><span data-i18n="dashboardStep4">提交工时</span></div>
    <div class="step" id="step5"><span class="step-num">5</span><span data-i18n="dashboardStep5">状态流转</span></div>
    <div class="step" id="step6"><span class="step-num">6</span><span data-i18n="dashboardStep6">完成</span></div>
  </div>

  <!-- 月度容量摘要 -->
  <div class="summary">
    <div class="stat"><div class="label" data-i18n="dashboardStatCapacity">月度容量</div><div class="value" id="statCapacity">-</div></div>
    <div class="stat"><div class="label" data-i18n="dashboardStatFilled">已填工时</div><div class="value" id="statFilled">-</div></div>
    <div class="stat"><div class="label" data-i18n="dashboardStatGap">月度缺口</div><div class="value" id="statGap">-</div></div>
    <div class="stat"><div class="label" data-i18n="dashboardStatOvertime">加班工时</div><div class="value" id="statOvertime">-</div></div>
  </div>

  <!-- 主面板：根据当前步骤显示不同内容 -->
  <div id="mainPanel"></div>

  <!-- 操作栏 -->
  <div class="actions-bar">
    <div class="left">
      <button class="btn-secondary" id="btnRefresh" data-i18n="dashboardBtnRefresh">重新加载</button>
      <button class="btn-secondary" id="btnDryRun" data-i18n="dashboardBtnDryRun">预览模式</button>
    </div>
    <div class="right">
      <button class="btn-primary" id="btnNext" data-i18n="dashboardNextBtn">下一步</button>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script type="module" src="src/dashboard.js"></script>
</body>
</html>
